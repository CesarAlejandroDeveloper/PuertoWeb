<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PuertoWeb | Enlaces</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="puertoweb.png">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sora', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { navy: '#0B1120' }
        }
      }
    }
  </script>
</head>
<body class="bg-navy text-gray-300 font-sans antialiased flex flex-col items-center min-h-screen py-10 px-5">

  <!-- Perfil -->
  <div class="flex flex-col items-center w-full max-w-md text-center mt-8">
    <img src="puertoweb.png" alt="PuertoWeb Logo" class="h-24 w-auto mb-4 drop-shadow-lg">
    <h1 class="text-3xl font-extrabold text-white tracking-tight">Puerto<span class="text-cyan-400">Web</span></h1>
    <p class="mt-2 text-sm text-gray-400">Páginas web ultrarrápidas para locales en Veracruz. Sin rentas ocultas.</p>
  </div>

  <!-- Botones de Enlaces -->
  <div class="flex flex-col w-full max-w-md gap-4 mt-8">
    
    <!-- Sitio Web -->
    <a href="https://puertoweb.tech" class="flex items-center justify-center w-full py-4 rounded-xl border border-slate-700 bg-slate-800/50 text-white font-semibold shadow-sm transition-all hover:bg-slate-700 hover:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">
      🌐 Visita nuestro Sitio Web
    </a>

    <!-- Telegram -->
    <a href="https://t.me/PuertoWebVeracruz" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center w-full py-4 rounded-xl border border-slate-700 bg-slate-800/50 text-white font-semibold shadow-sm transition-all hover:bg-slate-700 hover:border-[#229ED9] focus:outline-none focus:ring-2 focus:ring-[#229ED9]">
      ✈️ Escríbenos por Telegram
    </a>

    <!-- Facebook -->
    <!-- Sustituye el # con el link real de tu página de Facebook -->
    <a href="#" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center w-full py-4 rounded-xl border border-slate-700 bg-slate-800/50 text-white font-semibold shadow-sm transition-all hover:bg-slate-700 hover:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
      📘 Síguenos en Facebook
    </a>

    <!-- Correo -->
    <a href="mailto:contacto@puertoweb.tech" class="flex items-center justify-center w-full py-4 rounded-xl border border-slate-700 bg-slate-800/50 text-white font-semibold shadow-sm transition-all hover:bg-slate-700 hover:border-white focus:outline-none focus:ring-2 focus:ring-white">
      ✉️ Envíanos un Correo
    </a>

  </div>

  <footer class="mt-auto pt-10 pb-4 text-xs text-slate-500">
    © 2026 PuertoWeb
  </footer>

</body>
</html>
